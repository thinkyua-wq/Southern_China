     edit:{type:'text', list:'dl-dealer', get:function(r){return r.dealer||'';}, set:function(r,v){ p.onEdit(r.id,'dealer',v||null); }}},
    {t:'유형',k:'type',r:function(r){ return h('span',{className:'zh'},r.type||'-'); },
     edit:{type:'sel', opts:[''].concat(p.types), get:function(r){return r.type||'';}, set:function(r,v){ p.onEdit(r.id,'type',v||null); }}},
    {t:'3개월 판매',k:'t3',num:1,r:function(r){ return r.t3? h('b',null,nf(r.t3)) : h('span',{className:'dim'},'0'); }},
    {t:'1~'+base+'月 누계',k:'cum',num:1,r:function(r){ return h('span',{className:'dim'},nf(r.cum)); }},
    {t:'방문',k:'v',num:1,r:function(r){ return r.v? nf(r.v) : h('span',{className:'dim'},'0'); },
     edit:{type:'num', get:function(r){return r.v||0;}, set:function(r,v){ p.onEdit(r.id,'v',v); }}}
  ];

  var C=p.C;
  return h('div',null,
    h(ProvBar,{provs:p.provs,cur:p.prov,onPick:p.onProv,counts:p.counts,label:'지역'}),
    h('div',{className:'segs'},
      h('span',{className:'plb'},'기준 '+MON[base-1]+' · 최근 3개월 ('+span+')'),
      h('div',{className:'segb'}, SEG.map(function(x){
        return h('button',{key:x[0],className:'sg'+(seg===x[0]?' on':''),onClick:function(){ setSeg(x[0]); }},
          x[1], h('b',null,' '+nf(x[2])));
      }))),
    h('div',{className:'lay'},
      h(Card,Object.assign({title:'지역별'},C('in_prov')), h(Table,{cols:gcols('지역'),rows:byProv})),
      h(Card,Object.assign({title:'담당자별'},C('in_mgr')), h(Table,{cols:gcols('담당자'),rows:byMgr})),
      h(Card,Object.assign({title:'대리상별',note:byDeal.length+'개사',wide:true},C('in_deal')),
        h(Table,{cols:gcols('대리상'),rows:byDeal})),
      h(Card,Object.assign({title:(SEGN[seg]||'치과')+' 목록',
        note:nf(cur.length)+'곳 · '+MON[lo]+'~'+MON[base-1]+' 기준 · 더블클릭 수정',wide:true},C('in_list')),
        cur.length? h(Table,{cols:ccols,rows:cur.slice(0,300),locked:p.locked})
          : h('div',{className:'empty'},'해당하는 고객이 없습니다.'),
        cur.length>300? h('div',{className:'ed-n'},'※ 300곳까지 표시합니다.'):null),
      h('datalist',{id:'dl-dealer'},p.dealers.map(function(x){ return h('option',{key:x,value:x}); }))
    )
  );
}

function App(){
  var _b=useState(store); var db=_b[0], setDb=_b[1];
  var _a=useState(function(){
    var st=store();
    return (st.rows && st.rows.length)? st.rows : SEED.slice();
  }); var rows=_a[0], setRows=_a[1];
  var _c=useState('overview'); var tab=_c[0], setTab=_c[1];
  var _d=useState({prov:'',mgr:'',dealer:'',type:'',flag:''}); var flt=_d[0], setFlt=_d[1];
  var _e=useState(''); var q=_e[0], setQ=_e[1];
  var _f=useState(null); var msg=_f[0], setMsg=_f[1];
  var _g=useState({k:'total',d:-1}); var sort=_g[0], setSort=_g[1];
  var _h=useState(null); var sel=_h[0], setSel=_h[1];
  var _i=useState(new Date().getFullYear()); var py=_i[0], setPy=_i[1];
  var _j=useState(new Date().getMonth()+1); var pm=_j[0], setPm=_j[1];
  var _k=useState(null); var pick=_k[0], setPick=_k[1];   // viewing a past snapshot
  var _l=useState(false); var busy=_l[0], setBusy=_l[1];
  var _m=useState(getCloudUrl); var gurl=_m[0], setGurl=_m[1];
  var _n=useState(false); var cfg=_n[0], setCfg=_n[1];
  var _p=useState({mgr:'',dealer:'',cust:'',weekly:'',inact:''}); var tprov=_p[0], setTprov=_p[1];
  function setTP(k,v){ setTprov(function(o){ var n=Object.assign({},o); n[k]=v; return n; }); }
  var fileRef=useRef(null);

  var notes=db.notes||{};
  var hidden=db.hidden||{};
  var acts=db.acts||null;
  var snaps=useMemo(function(){ return sortSnaps(db.snaps||[]); },[db.snaps]);

  useEffect(function(){ persistAll(db, rows); },[db, rows]);
  useEffect(function(){ if(!msg) return; var t=setTimeout(function(){setMsg(null);},5000); return function(){clearTimeout(t);}; },[msg]);

  var provs=useMemo(function(){ return uniq(rows.map(function(r){return r.prov;})); },[rows]);
  var mgrs=useMemo(function(){ return uniq(rows.filter(function(r){return !flt.prov||r.prov===flt.prov;}).map(function(r){return r.mgr;})); },[rows,flt.prov]);
  var dealers=useMemo(function(){ return uniq(rows.map(function(r){return r.dealer;})); },[rows]);
  var types=useMemo(function(){ return uniq(rows.map(function(r){return r.type;})); },[rows]);

  // ── 모든 계산은 엑셀 데이터 기준 ──
  // pm(선택한 달)까지의 누계를 엑셀에서 바로 계산합니다. 스냅샷 불필요.
  // 주(pick)를 고른 경우에만 그 시점 스냅샷으로 대체합니다.
  var baseRows=useMemo(function(){
    if(pick && pick.per){
      var per=pick.per;
      return rows.filter(function(r){ return per[r.id]!==undefined; }).map(function(r){
        var q=per[r.id];
        var m=[]; for(var i=0;i<NM;i++) m.push(0);
        m[NM-1]=q.t;
        return Object.assign({},r,{m:m,v:q.v,_snapT:q.t});
      });
    }
    return rowsUpto(rows, pm);
  },[rows,pick,pm]);

  var view=useMemo(function(){
    var qq=q.trim().toLowerCase();
    return baseRows.filter(function(r){
      if(flt.prov && r.prov!==flt.prov) return false;
      if(flt.mgr && r.mgr!==flt.mgr) return false;
      if(flt.dealer){ if(flt.dealer==='__none'){ if(r.dealer) return false; } else if(r.dealer!==flt.dealer) return false; }
      if(flt.type && r.type!==flt.type) return false;
      if(flt.flag==='bd' && !r.bd) return false;
      if(flt.flag==='dec' && !r.dec) return false;
      if(flt.flag==='zero' && sum(r.m)>0) return false;
      if(flt.flag==='note' && !(notes[r.id]&&(notes[r.id].txt||notes[r.id].act))) return false;
      if(qq && r.name.toLowerCase().indexOf(qq)<0 && String(r.code||'').indexOf(qq)<0) return false;
      return true;
    });
  },[baseRows,flt,q,notes]);

  // KPI는 현재 탭의 지역 선택을 반영합니다.
  var tabProv = tprov[tab]||'';
  var kview=useMemo(function(){
    return tabProv? view.filter(function(r){ return r.prov===tabProv; }) : view;
  },[view,tabProv]);
  var A=useMemo(function(){ return agg(kview); },[kview]);
  // 최근 3개월 (기준달 pm) — 실질 지표
  var R3=useMemo(function(){ return recent3(kview, pm); },[kview,pm]);
  var R3p=useMemo(function(){ return pm>1? recent3(kview, pm-1) : null; },[kview,pm]);
  var autoA=useMemo(function(){ return autoIssues(rows, pm); },[rows,pm]);
  useEffect(function(){
    if(acts===null) setDb(function(pv){ return Object.assign({},pv,{acts:autoIssues(rows,pm)}); });
  },[]);
  var live=useMemo(function(){ return aggUpto(rows, pm); },[rows,pm]);
  var filtered = !!(flt.prov||flt.mgr||flt.dealer||flt.type||flt.flag||q||tabProv);

  // comparison baseline: the snapshot right before the one being viewed (or before live)
  // 비교 대상: 주를 고르면 직전 스냅샷, 아니면 엑셀에서 계산한 "전달 누계"
  var prev=useMemo(function(){
    if(pick){
      var i=-1;
      for(var k=0;k<snaps.length;k++){ if(snaps[k].y===pick.y&&snaps[k].w===pick.w){ i=k; break; } }
      return i>0? snaps[i-1] : null;
    }
    if(pm<=1) return null;
    var a=aggUpto(rows, pm-1);
    return {y:py, w:0, mo:pm-1, label:(pm-1)+'月', at:'',
      n:a.n, act:a.act, rate:a.rate, total:a.total, avg:a.avg, vis:a.vis,
      dec:a.dec, bd:a.bd, sys:a.sys, per:null, _excel:1};
  },[snaps,pick,rows,pm,py]);
  function prevLabel(a,b){
    if(!b) return '';
    if(b._excel) return '전달 대비';
    var am=a&&a.mo?a.mo:0, bm=b.mo||0;
    return (am&&bm&&am===bm)? '전주 대비' : '전달 대비';
  }
  var hardFilter = !!(flt.prov||flt.mgr||flt.dealer||flt.type||flt.flag||q||tabProv);
  var pv = hardFilter? null : prev;

  function saveEdit(d){
    if(pick){ setMsg({t:'err',m:'과거 주차를 보는 중에는 수정할 수 없습니다. "최신으로"를 먼저 누르세요.'}); return; }
    setRows(function(prevRows){
      return prevRows.map(function(r){
        if(r.id!==d.id) return r;
        var nr=Object.assign({},r,{
          s:d.s.map(function(x){return x.slice();}), v:d.v,
          mgr:d.mgr, dealer:d.dealer||null, type:d.type||null,
          prov:d.prov, name:d.name, yr:d.yr, dec:d.dec, bd:d.bd });
        return syncM(nr);
      });
    });
    setMsg({t:'ok',m:'수정했습니다. 표·KPI에 반영됐습니다. 주차 기록으로 남기려면 "이번 주 저장"을 누르세요.'});
  }

  function applyPaste(hits, mode){
    if(pick){ setMsg({t:'err',m:'과거 주차를 보는 중에는 수정할 수 없습니다. "최신으로"를 먼저 누르세요.'}); return; }
    if(!hits || !hits.length) return;
    var byId={};
    hits.forEach(function(x){ byId[x.row.id]=x; });
    var n=0, delta=0;
    setRows(function(prevRows){
      return prevRows.map(function(r){
        var x=byId[r.id];
        if(!x) return r;
        var s2=(r.s||[]).map(function(q){ return q.slice(); });
        while(s2.length<NM){ var z=[]; for(var i=0;i<NS;i++) z.push(0); s2.push(z); }
        var before=sum(s2[x.mi]);
        for(var j=0;j<NS;j++){
          s2[x.mi][j] = mode==='add' ? (s2[x.mi][j]||0)+x.after[j] : x.after[j];
        }
        delta += sum(s2[x.mi])-before;
        n++;
        return syncM(Object.assign({},r,{s:s2}));
      });
    });
    setMsg({t:'ok',m:nf(hits.length)+'건 반영했습니다 ('+(mode==='add'?'더하기':'덮어쓰기')+'). 주차 기록으로 남기려면 "이번 주 저장"을 누르세요.'});
  }

  // 월/연도를 고르면 그 달의 "마지막 저장된 주"로 자동 이동합니다.
  // 스냅샷이 대표하는 달(mo)로 찾습니다. mo가 없으면 주 시작일로 추정.
  function snapsOfMonth(y,m){
    return snaps.filter(function(s){
      if(s.y!==y) return false;
      var mo=s.mo || (new Date(s.at+'T00:00:00Z').getUTCMonth()+1);
      return mo===m;
    }).sort(function(a,b){ return a.w-b.w; });
  }
  // 월을 고르면 엑셀 데이터로 즉시 계산합니다 (스냅샷 불필요).
  function pickYear(y){ setPy(y); setPick(null); }
  function pickMonth(m){ setPm(m); setPick(null); }

  // 인라인 수정 (더블클릭) — 자동 저장
  function editField(id, key, val){
    if(pick){ setMsg({t:'err',m:'과거 주차를 보는 중에는 수정할 수 없습니다.'}); return; }
    setRows(function(pr){
      return pr.map(function(r){
        if(r.id!==id) return r;
        var nr=Object.assign({},r);
        nr[key]= val;
        return nr;   // 속성 수정은 수량(m)에 영향 없음
      });
    });
  }
  // 월 × 시스템 수량 수정
  function editCell(id, mi, si, val){
    if(pick){ setMsg({t:'err',m:'과거 주차를 보는 중에는 수정할 수 없습니다.'}); return; }
    setRows(function(pr){
      return pr.map(function(r){
        if(r.id!==id) return r;
        var s2=(r.s||[]).map(function(q){ return q.slice(); });
        while(s2.length<NM){ var z=[]; for(var i=0;i<NS;i++) z.push(0); s2.push(z); }
        s2[mi][si]=Math.max(0,val|0);
        return syncM(Object.assign({},r,{s:s2}));
      });
    });
  }

  function toggleCard(id){
    setDb(function(pv){
      var hd=Object.assign({},pv.hidden||{});
      if(hd[id]) delete hd[id]; else hd[id]=1;
      return Object.assign({},pv,{hidden:hd});
    });
  }
  function C(id){ return {hidden:!!hidden[id], onToggle:function(){ toggleCard(id); }}; }

  function group(key){
    var m={};
    view.forEach(function(r){ var k=r[key]; if(k===null||k===undefined||k==='') k='(미지정)'; (m[k]=m[k]||[]).push(r); });
    return Object.keys(m).map(function(k){
      var a=agg(m[k]); a.key=k;
      // 그룹 내 실적이 가장 큰 대리상 (담당자 옆에 표기)
      var dm={};
      m[k].forEach(function(r){
        if(!r.dealer) return;
        dm[r.dealer]=(dm[r.dealer]||0)+sum(r.m);
      });
      var best=null,bv=-1;
      Object.keys(dm).forEach(function(x){ if(dm[x]>bv){ bv=dm[x]; best=x; } });
      var cnt=Object.keys(dm).length;
      a.dealer = best? (cnt>1? best+' 외 '+(cnt-1)+'개사' : best) : null;
      return a;
    }).sort(function(x,y){ return y.total-x.total; });
  }
  var byProv=useMemo(function(){ return group('prov'); },[view]);
  // 탭 안 지역 버튼용 카운트
  var provCounts=useMemo(function(){
    var c={'':view.length};
    view.forEach(function(r){ c[r.prov]=(c[r.prov]||0)+1; });
    return c;
  },[view]);
  function tabRows(key){
    var pv=tprov[key];
    return pv? view.filter(function(r){ return r.prov===pv; }) : view;
  }
  function groupOf(rows,key){
    var m={};
    rows.forEach(function(r){ var k=r[key]; if(k===null||k===undefined||k==='') k='(미지정)'; (m[k]=m[k]||[]).push(r); });
    return Object.keys(m).map(function(k){
      var a=agg(m[k]); a.key=k;
      var dm={};
      m[k].forEach(function(r){ if(r.dealer) dm[r.dealer]=(dm[r.dealer]||0)+sum(r.m); });
      var best=null,bv=-1;
      Object.keys(dm).forEach(function(x){ if(dm[x]>bv){ bv=dm[x]; best=x; } });
      var cnt=Object.keys(dm).length;
      a.dealer = best? (cnt>1? best+' 외 '+(cnt-1)+'개사' : best) : null;
      return a;
    }).sort(function(x,y){ return y.total-x.total; });
  }
  var byMgr=useMemo(function(){ return group('mgr'); },[view]);
  var byDeal=useMemo(function(){ return group('dealer'); },[view]);
  var byType=useMemo(function(){ return group('type'); },[view]);

  function onFile(f){
    if(!f) return;
    if(pick){ setMsg({t:'err',m:'과거 주차를 보는 중에는 불러올 수 없습니다. "최신으로"를 먼저 누르세요.'}); return; }
    var fr=new FileReader();
    fr.onload=function(e){
      try{
        var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
        var ing=ingest(wb);
        if(!ing.crm.length && !ing.perf.length){
          setMsg({t:'err',m:'인식 가능한 시트가 없습니다. 客户名称·省份 컬럼이 있는지 확인해 주세요.'}); return;
        }
        var res=mergeData(rows,ing);
        setRows(res.rows);
        var st=res.stat;
        // 엑셀을 올리면 그 시점을 자동으로 기록합니다 (버튼 불필요)
        var k=isoWeekOf(new Date());
        var ws=isoWeekStart(k.y,k.w);
        var snap=makeSnap(res.rows,k.y,k.w,ws.toISOString().slice(0,10),ws.getUTCMonth()+1);
        var ns=(db.snaps||[]).filter(function(x){ return !(x.y===k.y&&x.w===k.w); }).concat([snap]);
        setDb(function(pv){ return Object.assign({},pv,{snaps:sortSnaps(ns)}); });
        setMsg({t:'ok',m:'불러왔습니다 — 실적 '+st.updP+'건, 고객정보 '+st.updC+'건, 신규 '+(st.addedC+st.addedP)+'건. '+k.y+'-'+wLabel(k.w)+' 주차로 자동 기록했습니다.'});
      }catch(err){ setMsg({t:'err',m:'파일을 읽지 못했습니다: '+err.message}); }
    };
    fr.onerror=function(){ setMsg({t:'err',m:'파일을 읽지 못했습니다.'}); };
    fr.readAsArrayBuffer(f);
  }

  function saveSnap(){
    var k=isoWeekOf(new Date());
    var inp=prompt('저장할 주차를 확인하세요 (ISO 주차)\n형식: 연도-주차  예) '+k.y+'-'+k.w, k.y+'-'+k.w);
    if(inp===null) return;
    var mm=String(inp).match(/(\d{4})\D+(\d{1,2})/);
    if(!mm){ setMsg({t:'err',m:'형식이 올바르지 않습니다. 예) 2026-29'}); return; }
    var y=+mm[1], w=+mm[2];
    if(w<1||w>weeksInIsoYear(y)){ setMsg({t:'err',m:y+'년은 W1~W'+weeksInIsoYear(y)+'까지입니다.'}); return; }
    var st=isoWeekStart(y,w);
    // 이 주가 속한 달 = 주 시작일 기준 (월말 걸침 주는 시작 달로 귀속)
    var mo=st.getUTCMonth()+1;
    var s=makeSnap(rows,y,w, st.toISOString().slice(0,10), mo);
    var ex=(db.snaps||[]).some(function(x){ return x.y===y&&x.w===w; });
    if(ex && !confirm(y+'-'+wLabel(w)+' 스냅샷이 이미 있습니다. 덮어쓸까요?')) return;
    var ns=(db.snaps||[]).filter(function(x){ return !(x.y===y&&x.w===w); }).concat([s]);
    setDb(Object.assign({},db,{snaps:sortSnaps(ns)}));
    setPy(y); setPm(st.getUTCMonth()+1);
    setMsg({t:'ok',m:y+'-'+wLabel(w)+' 스냅샷을 저장했습니다.'});
  }
  function delSnap(s){
    if(!confirm(s.y+'-'+s.label+' 스냅샷을 지울까요? 되돌릴 수 없습니다.')) return;
    setDb(Object.assign({},db,{snaps:(db.snaps||[]).filter(function(x){ return !(x.y===s.y&&x.w===s.w); })}));
    if(pick&&pick.y===s.y&&pick.w===s.w) setPick(null);
  }

  // ---- cloud ----
  function doCloudSave(){
    if(!gurl){ setCfg(true); return; }
    setBusy(true);
    cloudSave(gurl,{rows:rows,notes:notes,snaps:db.snaps||[],hidden:hidden,acts:acts})
      .then(function(r){
        setMsg({t:r.noCors?'warn':'ok',
          m: r.noCors
            ? '전송했습니다 (응답 확인 불가 모드) · '+r.info+' — ☁️ 불러오기로 정상 저장을 확인해 주세요.'
            : '클라우드에 저장했습니다 · '+r.info});
      })
      .catch(function(e){ setMsg({t:'err',m:'클라우드 저장 실패: '+e.message+' — 중국에서 구글 접속이 막혀 있으면 VPN이 필요합니다. 데이터는 이 기기에 안전하게 남아 있습니다.'}); })
      .then(function(){ setBusy(false); });
  }
  function doCloudLoad(){
    if(!gurl){ setCfg(true); return; }
    if(!confirm('⚠️ 클라우드에서 불러오면 지금 화면의 데이터·메모·스냅샷이 덮어써집니다.\n\n계속하시겠습니까?')) return;
    setBusy(true);
    cloudLoad(gurl)
      .then(function(r){
        if(!r){ setMsg({t:'err',m:'클라우드에 저장된 데이터가 없습니다.'}); return; }
        var o=r.data;
        if(o.rows) setRows(o.rows);
        setDb({notes:o.notes||{}, snaps:sortSnaps(o.snaps||[]), hidden:o.hidden||{}, acts:o.acts||null});
        setPick(null);
        setMsg({t:'ok',m:'클라우드에서 불러왔습니다. (마지막 저장 '+(r.at||'알 수 없음')+')'});
      })
      .catch(function(e){ setMsg({t:'err',m:'클라우드 불러오기 실패: '+e.message+' — VPN 연결을 확인하세요.'}); })
      .then(function(){ setBusy(false); });
  }

  function exportJson(){
    var blob=new Blob([JSON.stringify({rows:rows,notes:notes,snaps:db.snaps||[],hidden:hidden,acts:acts,at:new Date().toISOString()},null,1)],{type:'application/json'});
    var u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u; a.download='화남현황판_백업_'+today()+'.json'; a.click(); URL.revokeObjectURL(u);
  }
  function importJson(f){
    if(!f) return;
    var fr=new FileReader();
    fr.onload=function(e){
      try{
        var o=JSON.parse(e.target.result);
        if(o.rows) setRows(o.rows);
        setDb({notes:o.notes||{}, snaps:sortSnaps(o.snaps||[]), hidden:o.hidden||{}, acts:o.acts||null});
        setPick(null);
        setMsg({t:'ok',m:'백업을 복원했습니다.'});
      }catch(err){ setMsg({t:'err',m:'백업 파일이 올바르지 않습니다.'}); }
    };
    fr.readAsText(f);
  }
  function exportXlsx(){
    var pp=prev?prev.per:null;
    var data=view.map(function(r){
      var o={省份:r.prov,客户经理:r.mgr,客户名称:r.name,代理商名称:r.dealer||'',客户类型:r.type||'',
             BD客户:r.bd?'是':'',持续下降:r.dec?'是':''};
      if(!pick){
        for(var i=0;i<NM;i++) o[MON[i]]=r.m[i]||0;
        for(var j=0;j<NS;j++){ var t=0; for(var i2=0;i2<NM;i2++) t+=((r.s&&r.s[i2]&&r.s[i2][j])||0); o[SYS[j]]=t; }
      }
      o['판매수량']=sum(r.m); o['방문']=r.v||0;
      if(pp) o['전주대비']= sum(r.m)-((pp[r.id]&&pp[r.id].t)||0);
      var nt=notes[r.id];
      o['메모']=nt&&nt.txt?nt.txt:''; o['액션']=nt&&nt.act?nt.act:'';
      return o;
    });
    var ws=XLSX.utils.json_to_sheet(data), wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'화남현황');
    XLSX.writeFile(wb,'화남_현황_'+(pick?(pick.y+'_'+pick.label):today())+'.xlsx');
  }
  function setNote(id,k,v){
    setDb(function(p){
      var n=Object.assign({},p.notes);
      n[id]=Object.assign({},n[id]||{}); n[id][k]=v;
      if(!n[id].txt && !n[id].act) delete n[id];
      return Object.assign({},p,{notes:n});
    });
  }

  var TABS=[['overview','월별현황'],['weekly','주간현황'],['mgr','담당자'],['dealer','대리상'],['cust','고객'],['inact','비활성화 고객']];
  var lastS=snaps.length? snaps[snaps.length-1] : null;
  var TITLE={overview:'월별현황',weekly:'주간현황',mgr:'담당자별 실적',dealer:'대리상별 실적',cust:'고객 목록',inact:'비활성화 고객'};
  var hidCount=Object.keys(hidden).length;

  return h('div',{className:'shell'},
    /* ===== dark rail ===== */
    h('aside',{className:'rail'},
      h('div',{className:'rail-b'},
        h('h1',null,'화남 CRM 현황판'),
        h('p',null,'华南本部 · '+nf(rows.length)+'개 고객')),

      h('div',{className:'rail-s'},
        h('h4',null,'메뉴'),
        h('nav',{className:'rnav'}, TABS.map(function(t){
          return h('button',{key:t[0],className:'rb'+(tab===t[0]?' on':''),
            onClick:function(){setTab(t[0]);}}, t[1]);
        }))),

      h('div',{className:'rail-s'},
        h('h4',null,'필터'),
        h('input',{className:'rsel',placeholder:'고객명·편코드 검색',value:q,
          onChange:function(e){setQ(e.target.value);}}),
        h('select',{className:'rsel',value:flt.prov,onChange:function(e){setFlt(Object.assign({},flt,{prov:e.target.value,mgr:''}));}},
          h('option',{value:''},'전체 지역'),provs.map(function(x){return h('option',{key:x,value:x},x);})),
        h('select',{className:'rsel',value:flt.mgr,onChange:function(e){setFlt(Object.assign({},flt,{mgr:e.target.value}));}},
          h('option',{value:''},'전체 담당자'),mgrs.map(function(x){return h('option',{key:x,value:x},x);})),
        h('select',{className:'rsel',value:flt.dealer,onChange:function(e){setFlt(Object.assign({},flt,{dealer:e.target.value}));}},
          h('option',{value:''},'전체 대리상'),h('option',{value:'__none'},'(미배정)'),
          dealers.map(function(x){return h('option',{key:x,value:x},x);})),
        h('select',{className:'rsel',value:flt.type,onChange:function(e){setFlt(Object.assign({},flt,{type:e.target.value}));}},
          h('option',{value:''},'전체 유형'),types.map(function(x){return h('option',{key:x,value:x},x);})),
        h('select',{className:'rsel',value:flt.flag,onChange:function(e){setFlt(Object.assign({},flt,{flag:e.target.value}));}},
          h('option',{value:''},'조건 없음'),h('option',{value:'dec'},'持续下降만'),h('option',{value:'bd'},'BD客户만'),
          h('option',{value:'zero'},'실적 0만'),h('option',{value:'note'},'메모 있는 것만')),
        filtered? h('button',{className:'rbtn',onClick:function(){setFlt({prov:'',mgr:'',dealer:'',type:'',flag:''});setQ('');}},'필터 초기화'):null,
        hidCount? h('button',{className:'rbtn',onClick:function(){ setDb(Object.assign({},db,{hidden:{}})); }},'숨긴 카드 '+hidCount+'개 모두 보기'):null),

      h('div',{className:'rail-s'},
        h('h4',null,'데이터'),
        h('div',{className:'rgrid'},
          h('button',{className:'rbtn pri',onClick:function(){fileRef.current.click();},disabled:busy},'엑셀 불러오기'),
          h('button',{className:'rbtn',onClick:doCloudSave,disabled:busy},'클라우드 저장'),
          h('button',{className:'rbtn',onClick:doCloudLoad,disabled:busy},'클라우드 불러오기'),
          h('button',{className:'rbtn',onClick:exportXlsx,disabled:busy},'엑셀 다운로드'),
          h('button',{className:'rbtn',onClick:exportJson,disabled:busy},'백업'),
          h('label',{className:'rbtn fl'},'복원',
            h('input',{type:'file',accept:'.json',onChange:function(e){importJson(e.target.files[0]); e.target.value='';}})),
          h('button',{className:'rbtn',onClick:function(){setCfg(!cfg);}},'설정'))),

      h('div',{className:'rfoot'},
        '메모 '+Object.keys(notes).length+'건 · 스냅샷 '+snaps.length+'개',h('br'),
        '이 기기에 저장'+(gurl?' · 클라우드 연결됨':''),h('br'),
        '华南本部 · MEGAGEN'),

      h('input',{ref:fileRef,type:'file',accept:'.xlsx,.xls',style:{display:'none'},
        onChange:function(e){ onFile(e.target.files[0]); e.target.value=''; }})
    ),

    /* ===== main ===== */
    h('main',{className:'main'},
      h('div',{className:'mhead'},
        h('div',null,
          h('h2',null,TITLE[tab]),
          h('div',{className:'sub'}, pick? ('과거 주차 시점 — '+pick.y+'-'+pick.label)
            : ('단위: 임플란트 개 · 1~'+pm+'月 누계 (엑셀 기준)'))),
        h('div',{className:'mmeta'},
          pick? h('b',{className:'vw'},pick.y+'-'+pick.label+' 시점 보기') : '데이터 기준일: 2026. 07. 15',
          h('br'),
          snaps.length? ('스냅샷 '+snaps.length+'개 · 최근 '+lastS.y+'-'+lastS.label) : '스냅샷 없음')),

      cfg? h('div',{className:'cfg'},
        h('div',{className:'np-l'},'Google Apps Script 웹앱 URL (유아님 전용 — 이 기기에만 저장됩니다)'),
        h('div',{className:'cfg-r'},
          h('input',{className:'sel cfg-i',placeholder:'https://script.google.com/macros/s/.../exec',
            value:gurl,onChange:function(e){setGurl(e.target.value);}}),
          h('button',{className:'btn pri sm',onClick:function(){ setCloudUrl(gurl.trim()); setCfg(false); setMsg({t:'ok',m:gurl.trim()?'URL을 저장했습니다.':'URL을 지웠습니다.'}); }},'저장'),
          h('button',{className:'btn sm',onClick:function(){setCfg(false);}},'닫기')),
        h('div',{className:'cfg-n'},'· 비워두면 클라우드 기능이 꺼집니다. 영업사원 배포본은 비워둔 채로 두세요.',h('br'),
          '· 중국에서 구글은 차단됩니다. VPN 연결 시에만 작동합니다.',h('br'),
          h('b',null,'· 다른 앱(pricing·index·edu_makt)과 같은 URL을 쓰면 서로 데이터가 사라집니다.'),
          lastCloudSave()? h('span',null,h('br'),'· 마지막 클라우드 저장: '+lastCloudSave().slice(0,16).replace('T',' ')) : null)
      ):null,

      msg? h('div',{className:'toast '+msg.t,role:'status'},msg.m):null,
      busy? h('div',{className:'toast ok'},'처리 중입니다…'):null,

      h(PeriodBar,{snaps:snaps,cur:pick,y:py,m:pm,onYear:pickYear,onMonth:pickMonth,onPick:setPick}),

      h('div',{className:'kpis kpis-5'},
        h(KPI,{label:'고객수',value:nf(A.n),unit:'개',
          sub:(filtered||tabProv)?('전체 '+nf(baseRows.length)+'개 중'):null,prev:pv,delta:pv?A.n-pv.n:null}),
        h(KPI,{label:'거래 고객',value:nf(A.act),unit:'개',sub:'실적 발생',prev:pv,delta:pv?A.act-pv.act:null}),
        h(KPI,{label:'누적 구매율',value:pf(A.rate),sub:'1~'+pm+'月 한 번이라도',prev:pv,delta:pv?A.rate-pv.rate:null,pct:1}),
        h(KPI,{label:'고객당 평균구매수',value:A.avg.toFixed(1),unit:'개',prev:pv,delta:pv?A.avg-pv.avg:null,dec:1}),
        h(KPI,{label:'3개월 미구매',value:nf(R3.no),unit:'곳',warn:R3.no>0,
          sub:MON[R3.lo]+'~'+MON[R3.hi-1]+' 구매 0',
          prev:R3p?{}:null, delta:R3p? R3.no-R3p.no : null, invert:1}),
        h(KPI,{label:'실구매율',value:pf(R3.rate),sub:'최근 3개월 기준',
          prev:R3p?{}:null, delta:R3p? R3.rate-R3p.rate : null, pct:1})),

      (pm===NM)? h('div',{className:'note-w'},
        '※ '+MON[NM-1]+'은 진행 중인 달입니다(15일 기준). 3개월 창에 미완 월이 포함되어 미구매·실구매율이 실제보다 나쁘게 보일 수 있습니다.'
      ) : null,

      h('div',{className:'kpis kpis-s'},
        SYS.map(function(sn,i){
          var v=A.sys[i], sh=A.total? v/A.total*100 : 0;
          return h(KPI,{key:i,label:sn,value:nf(v),unit:'개',sub:A.total? pf(sh)+' 비중':null,
            prev:pv&&pv.sys?pv:null, delta:(pv&&pv.sys)? v-(pv.sys[i]||0) : null});
        }),
        h(KPI,{label:'총 판매수량',value:nf(A.total),unit:'개',hero:1,sub:'AO+AR+ST+BD+ARi',
          prev:pv,delta:pv?A.total-pv.total:null})),

      h('div',{className:'snaps'},
        pv? h('span',{className:'pchip'},
              prevLabel(pick||{mo:lastS&&lastS.mo}, pv)+' = ',
              h('b',null, pv._excel? pv.label : ((pv.mo? pv.mo+'月 ':'')+pv.label)))
          : h('span',{className:'pchip'}, filtered? '필터 중 — 증감 미표시'
              : (snaps.length? '이전 스냅샷이 있어야 증감이 표시됩니다' : '스냅샷 저장 시 증감 표시')),
        snaps.slice(-10).map(function(x){
          return h('span',{key:x.y+'-'+x.w,className:'snap'+((pick&&pick.y===x.y&&pick.w===x.w)?' cur':'')},
            h('button',{className:'sl',onClick:function(){ setPick(x); setPy(x.y); setPm(new Date(x.at).getUTCMonth()+1); }},
              h('b',null,x.y+'-'+x.label), h('span',{className:'dim'},x.at), h('b',null,nf(x.total))),
            h('button',{className:'x',onClick:function(){delSnap(x);},title:'삭제'},'×'));
        })),

      tab==='weekly'? h(IssueActions,{items:acts||autoA, auto:function(){ return autoIssues(rows,pm); },
        onChange:function(n){ setDb(function(pv){ return Object.assign({},pv,{acts:n}); }); }}) : null,

      tab==='overview'? h(Overview,{A:A,view:view,byProv:byProv,byType:byType,pick:pick,C:C,
        hq:hqIssues(rows,pm), pm:pm}):null,
      tab==='weekly'? h(WeeklyTab,{snaps:snaps,rows:rows,prev:prev,notes:notes,C:C,
        provs:provs, prov:tprov.weekly, onProv:function(v){ setTP('weekly',v); },
        counts:(function(){ var c={'':rows.length}; rows.forEach(function(r){ c[r.prov]=(c[r.prov]||0)+1; }); return c; })()}):null,
      tab==='mgr'? h(MgrTab,{by:groupOf(tabRows('mgr'),'mgr'),C:C,rows:tabRows('mgr'),pm:pm,
        provs:provs, prov:tprov.mgr, onProv:function(v){ setTP('mgr',v); }, counts:provCounts}):null,
      tab==='dealer'? h(DealTab,{by:groupOf(tabRows('dealer'),'dealer'),C:C,rows:tabRows('dealer'),pm:pm,
        provs:provs, prov:tprov.dealer, onProv:function(v){ setTP('dealer',v); }, counts:provCounts}):null,
      tab==='cust'? h(CustTab,{view:tabRows('cust'),notes:notes,setNote:setNote,sort:sort,setSort:setSort,sel:sel,setSel:setSel,
        prev:prev,pick:pick,C:C,onEdit:editField,onCell:editCell,locked:!!pick,dealers:dealers,types:types,mgrs:mgrs,
        provs:provs, prov:tprov.cust, onProv:function(v){ setTP('cust',v); }, counts:provCounts}):null,
      tab==='inact'? h(InactiveTab,{rows:tabRows('inact'),pm:pm,onEdit:editField,C:C,locked:!!pick,
        dealers:dealers, types:types,
        provs:provs, prov:tprov.inact, onProv:function(v){ setTP('inact',v); }, counts:provCounts}):null
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
